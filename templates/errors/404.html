{% extends "base.html" %}

{% block title %}Page not found | Examination Management Portal{% endblock %}

{% block content %}
<section class="error-page py-5">
    <div class="container">
        <div class="admin-panel error-card text-center">
            <span class="error-icon"><i class="bi bi-search"></i></span>
            <span class="eyebrow mt-3">404 · Page not found</span>
            <h1 class="h2 fw-bold mt-2">We could not find that page</h1>
            <p class="text-secondary">The link may be incorrect, or the page may have been moved.</p>
            <a class="btn btn-primary rounded-pill px-4" href="{{ url_for('index') }}">Back to home</a>
        </div>
    </div>
</section>
{% endblock %}
