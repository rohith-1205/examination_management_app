{% extends "base.html" %}

{% block title %}Approval Pending | Examination Management Portal{% endblock %}

        <div class="auth-icon auth-icon-warm"><i class="bi bi-hourglass-split"></i></div>
        <span class="eyebrow mt-3">One more step</span>

        <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-house me-2"></i>Back to home
        </a>
    </div>
</section>
{% endblock %}
