{% extends "base.html" %}

{% block content %}
<section class="admin-page py-4">
    <div class="container">
        <nav class="admin-tabs mb-4" aria-label="Admin navigation">
            <a class="admin-tab {% if active_tab == 'dashboard' %}active{% endif %}"
               href="{{ url_for('admin.dashboard') }}">
                <i class="bi bi-grid-1x2 me-1"></i>Dashboard
            </a>
            <a class="admin-tab {% if active_tab == 'courses' %}active{% endif %}"
               href="{{ url_for('admin.courses') }}">
                <i class="bi bi-journal-bookmark me-1"></i>Courses
            </a>
            <a class="admin-tab {% if active_tab == 'exams' %}active{% endif %}"
               href="{{ url_for('admin.exams') }}">
                <i class="bi bi-file-earmark-text me-1"></i>Exams
            </a>
            <span class="admin-tab admin-tab-disabled"><i class="bi bi-person-workspace me-1"></i>Examiners</span>
            <span class="admin-tab admin-tab-disabled"><i class="bi bi-mortarboard me-1"></i>Students</span>
            <span class="admin-tab admin-tab-disabled"><i class="bi bi-calendar3 me-1"></i>Slots</span>
            <span class="admin-tab admin-tab-disabled"><i class="bi bi-ticket-perforated me-1"></i>Bookings</span>
        </nav>
        {% block admin_content %}{% endblock %}
    </div>
</section>
{% endblock %}
