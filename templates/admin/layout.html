{% extends "base.html" %}

{% block content %}
<section class="admin-page py-4">
    <div class="container">
        <nav class="admin-tabs mb-4" aria-label="Admin navigation">
            <a class="admin-tab {% if active_tab == 'dashboard' %}active{% endif %}"
               href="{{ url_for('admin.dashboard') }}">
                <i class="bi bi-grid-1x2 me-1"></i>Dashboard
            </a>
            <a class="admin-tab {% if active_tab == 'courses' %}active{% endif %}"
               href="{{ url_for('admin.courses') }}">
                <i class="bi bi-journal-bookmark me-1"></i>Courses
            </a>
            <a class="admin-tab {% if active_tab == 'exams' %}active{% endif %}"
               href="{{ url_for('admin.exams') }}">
                <i class="bi bi-file-earmark-text me-1"></i>Exams
            </a>
            <a class="admin-tab {% if active_tab == 'examiners' %}active{% endif %}"
               href="{{ url_for('admin.examiners') }}">
                <i class="bi bi-person-workspace me-1"></i>Examiners
            </a>
            <a class="admin-tab {% if active_tab == 'students' %}active{% endif %}"
               href="{{ url_for('admin.students') }}">
                <i class="bi bi-mortarboard me-1"></i>Students
            </a>
            <a class="admin-tab {% if active_tab == 'slots' %}active{% endif %}"
               href="{{ url_for('admin.slots') }}">
                <i class="bi bi-calendar3 me-1"></i>Slots
            </a>
            <a class="admin-tab {% if active_tab == 'bookings' %}active{% endif %}"
               href="{{ url_for('admin.bookings') }}">
                <i class="bi bi-ticket-perforated me-1"></i>Bookings
            </a>
            <a class="admin-tab {% if active_tab == 'search' %}active{% endif %}"
               href="{{ url_for('admin.search') }}">
                <i class="bi bi-search me-1"></i>Search
            </a>
        </nav>
        {% block admin_content %}{% endblock %}
    </div>
</section>
{% endblock %}
