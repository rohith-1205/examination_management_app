{% extends "base.html" %}

{% block content %}
<section class="examiner-page py-4">
    <div class="container">
        <nav class="examiner-tabs mb-4" aria-label="Examiner navigation">
            <a class="examiner-tab {% if active_page == 'dashboard' %}active{% endif %}"
               href="{{ url_for('examiner.dashboard') }}">
                <i class="bi bi-grid-1x2 me-1"></i>Dashboard
            </a>
            <a class="examiner-tab {% if active_page == 'exams' %}active{% endif %}"
               href="{{ url_for('examiner.dashboard') }}#assigned-exams">
                <i class="bi bi-file-earmark-text me-1"></i>My Exams
            </a>
        </nav>
        {% block examiner_content %}{% endblock %}
    </div>
</section>
{% endblock %}
